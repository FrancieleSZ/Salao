<g transform="translate(600 120)"><rect class="card" width="380" height="190"/><rect class="bar" width="380" height="48" rx="12"/><rect class="bar" y="36" width="380" height="12"/><text class="head" x="18" y="32">PROFISSIONAIS</text><text class="field" x="18" y="82">Identificador: id_profissional</text><text class="field" x="18" y="112">nome, telefone</text><text class="field" x="18" y="142">ativo</text><text class="field" x="18" y="172">data_cadastro</text></g>
