<text x="50" y="770" class="note">Relacionamento Profissionais–Especialidades: N:N (0,n) em ambos os lados; resolvido no modelo lógico por tabela associativa.</text>
<text x="50" y="800" class="note">Pagamento: um agendamento pode ter zero ou um pagamento; cada pagamento pertence a exatamente um agendamento.</text>
<text x="50" y="830" class="note">A regra de pagamento único por agendamento deve ser confirmada com a responsável antes da implementação.</text>
