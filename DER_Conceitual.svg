<text x="50" y="790" class="small">Profissionais–Especialidades: N:N, com participação opcional dos dois lados; a associação é materializada no modelo lógico.</text>
<text x="50" y="820" class="small">Pagamento: o desenho considera zero ou um pagamento por agendamento; confirmar essa regra com a responsável.</text>
<text x="50" y="850" class="small">Compra, fornecedor e estoque foram identificados como processos, mas exigem validação de escopo antes de ampliar o DER.</text>
