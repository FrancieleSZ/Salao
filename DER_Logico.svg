<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">DER lógico revisado — Salão dos Primos</title><desc id="desc">Tabelas com atributos, chaves primárias e estrangeiras e tipos físicos sugeridos.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#292438}.main{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#665d73}.table{fill:#fff;stroke:#62448c;stroke-width:2;rx:9}.bar{fill:#62448c}.th{font-size:20px;font-weight:700;fill:#fff}.row{font-size:16px}.pk{font-weight:700;fill:#805a00}.fk{font-weight:700;fill:#2458a0}.edge{stroke:#877496;stroke-width:2.5;fill:none}.label{font-size:15px;font-weight:700;fill:#62448c}</style></defs>
<rect width="1600" height="1000" fill="#f8f6fb"/>
<text x="50" y="48" class="main">DER Lógico — Salão dos Primos</text><text x="50" y="78" class="sub">PK = chave primária · FK = chave estrangeira · Tipos genéricos sugeridos; adaptar ao SGBD escolhido</text>
<!-- links behind boxes -->
<path class="edge" d="M350 230 C405 250 420 470 470 500"/><text class="label" x="375" y="360">1:N</text>
<path class="edge" d="M730 230 L730 430"/><text class="label" x="740" y="335">1:N</text>
<path class="edge" d="M1110 230 C1060 300 1020 420 960 500"/><text class="label" x="1030" y="350">1:N</text>
<path class="edge" d="M590 200 C680 245 760 320 850 380"/><text class="label" x="690" y="285">N:N</text>
<path class="edge" d="M1010 190 L1010 330"/><text class="label" x="1020" y="265">N:N</text>
<path class="edge" d="M960 680 C1060 700 1100 720 1180 740"/><text class="label" x="1050" y="700">0..1</text>
<!-- tables -->
<g transform="translate(40 110)"><rect class="table" width="310" height="270"/><rect class="bar" width="310" height="42" rx="9"/><rect class="bar" y="30" width="310" height="12"/><text class="th" x="14" y="28">Cliente</text><text class="row pk" x="14" y="72">PK id_cliente INTEGER</text><text class="row" x="14" y="102">nome VARCHAR(120)</text><text class="row" x="14" y="132">telefone VARCHAR(20)</text><text class="row" x="14" y="162">telefone_2 VARCHAR(20)</text><text class="row" x="14" y="192">email VARCHAR(254)</text><text class="row" x="14" y="222">email_2 VARCHAR(254)</text><text class="row" x="14" y="252">data_cadastro TIMESTAMP</text></g>
<g transform="translate(430 110)"><rect class="table" width="300" height="220"/><rect class="bar" width="300" height="42" rx="9"/><rect class="bar" y="30" width="300" height="12"/><text class="th" x="14" y="28">Profissionais</text><text class="row pk" x="14" y="72">PK id_profissional INTEGER</text><text class="row" x="14" y="102">nome VARCHAR(120)</text><text class="row" x="14" y="132">telefone VARCHAR(20)</text><text class="row" x="14" y="162">ativo BOOLEAN</text><text class="row" x="14" y="192">data_cadastro TIMESTAMP</text></g>
<g transform="translate(810 110)"><rect class="table" width="330" height="180"/><rect class="bar" width="330" height="42" rx="9"/><rect class="bar" y="30" width="330" height="12"/><text class="th" x="14" y="28">Especialidades</text><text class="row pk" x="14" y="72">PK id_especialidade INTEGER</text><text class="row" x="14" y="102">nome VARCHAR(100) UNIQUE</text><text class="row" x="14" y="132">descricao VARCHAR(500)</text></g>
<g transform="translate(810 340)"><rect class="table" width="370" height="150"/><rect class="bar" width="370" height="42" rx="9"/><rect class="bar" y="30" width="370" height="12"/><text class="th" x="14" y="28">Profissional_Especialidade</text><text class="row pk" x="14" y="72">PK, FK id_profissional INTEGER</text><text class="row pk" x="14" y="102">PK, FK id_especialidade INTEGER</text><text class="row" x="14" y="132">PK composta pelas duas FKs</text></g>
<g transform="translate(40 520)"><rect class="table" width="350" height="220"/><rect class="bar" width="350" height="42" rx="9"/><rect class="bar" y="30" width="350" height="12"/><text class="th" x="14" y="28">Procedimentos</text><text class="row pk" x="14" y="72">PK id_procedimento INTEGER</text><text class="row" x="14" y="102">nome VARCHAR(120)</text><text class="row" x="14" y="132">duracao_minutos INTEGER</text><text class="row" x="14" y="162">preco DECIMAL(10,2)</text><text class="row" x="14" y="192">descricao VARCHAR(500)</text></g>
<g transform="translate(470 430)"><rect class="table" width="490" height="330"/><rect class="bar" width="490" height="42" rx="9"/><rect class="bar" y="30" width="490" height="12"/><text class="th" x="14" y="28">Agendamentos</text><text class="row pk" x="14" y="72">PK id_agendamento INTEGER</text><text class="row" x="14" y="102">data_agendamento DATE</text><text class="row" x="14" y="132">hora_inicio TIME</text><text class="row" x="14" y="162">hora_fim TIME</text><text class="row" x="14" y="192">status VARCHAR(20)</text><text class="row" x="14" y="222">observacoes TEXT</text><text class="row" x="14" y="252">data_criacao TIMESTAMP</text><text class="row fk" x="14" y="282">FK id_cliente INTEGER</text><text class="row fk" x="14" y="307">FK id_profissional INTEGER</text></g>
<g transform="translate(1180 650)"><rect class="table" width="370" height="240"/><rect class="bar" width="370" height="42" rx="9"/><rect class="bar" y="30" width="370" height="12"/><text class="th" x="14" y="28">Pagamento</text><text class="row pk" x="14" y="72">PK id_pagamento INTEGER</text><text class="row fk" x="14" y="102">FK id_agendamento INTEGER UNIQUE</text><text class="row" x="14" y="132">data_pagamento TIMESTAMP</text><text class="row" x="14" y="162">valor_pago DECIMAL(10,2)</text><text class="row" x="14" y="192">forma_pagamento VARCHAR(20)</text><text class="row" x="14" y="222">observacoes TEXT</text></g>
<text x="40" y="820" class="sub">Agendamentos também deve conter FK id_procedimento INTEGER (omitido no espaço visual; faz parte do esquema lógico descrito no README).</text>
<text x="40" y="850" class="sub">Pagamento.id_agendamento UNIQUE representa a hipótese de no máximo um pagamento por agendamento; confirmar antes de implementar.</text>
<text x="40" y="880" class="sub">A prevenção de sobreposição exige validação transacional. Índices comuns, sozinhos, não garantem essa regra.</text>
<text x="40" y="910" class="sub">Os tipos físicos são sugestões. Compra, fornecedor e estoque precisam de validação de escopo para serem incluídos no DER.</text>
</svg>